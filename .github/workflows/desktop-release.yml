# Builds Hubble Desktop for Windows, macOS and Linux and attaches every
# installer to a DRAFT GitHub Release. Nothing here publishes anything: a
# person installs the drafted installers, checks them, and publishes the draft
# by hand. The website (/, /download, /api/download, /api/desktop/release)
# reads the latest *published* release from GitHub, so publishing the draft is
# what makes the downloads appear — no pull request, no deploy. See
# docs/desktop-release.md.
#
# Trigger: push a tag `desktop-v<version>` matching src-tauri/tauri.conf.json,
# or run it by hand for a tag that already exists.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. desktop-v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  # Never interpolated into a script directly: read through the environment
  # and checked against a fixed pattern first.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Tag shape
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like desktop-v1.2.3 (got '$RELEASE_TAG')"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Tag matches the app version everywhere
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          if [ "$RELEASE_TAG" != "desktop-v$VERSION" ] || [ "$PKG" != "$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "::error::$RELEASE_TAG vs tauri.conf.json $VERSION, package.json $PKG, Cargo.toml $CARGO — they must all agree"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            bundles: nsis,msi
            target: ""
            rust-targets: ""
          - name: macOS (universal)
            os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x64)
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev pkg-config build-essential file

      # Node builds the static frontend export every installer ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}-${{ matrix.target }}

      - run: npm ci

      # Code signing, when its secrets exist (docs/desktop-release.md "Code
      # signing"). Only non-empty values are exported, so an unconfigured
      # repository builds unsigned rather than failing on an empty identity.
      - name: macOS signing and notarization (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "$name<<__HUBBLE_EOF__"; echo "$value"; echo "__HUBBLE_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then echo "::notice::macOS build is not signed or notarized (no APPLE_SIGNING_IDENTITY secret)."; fi

      # A release-profile build: `tauri build` without --debug. Its
      # beforeBuildCommand builds the static frontend export.
      - name: Build the installers
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --ci --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"
          else
            npx tauri build --ci --bundles "${{ matrix.bundles }}"
          fi

      - name: Collect the installers
        shell: bash
        run: |
          BUNDLE=src-tauri/target/release/bundle
          if [ -n "${{ matrix.target }}" ]; then BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"; fi
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows) cp "$BUNDLE/nsis/Hubble_${VERSION}_x64-setup.exe" "$BUNDLE/msi/Hubble_${VERSION}_x64_en-US.msi" dist/ ;;
            macOS)   cp "$BUNDLE/dmg/Hubble_${VERSION}_universal.dmg" dist/ ;;
            Linux)   cp "$BUNDLE/appimage/Hubble_${VERSION}_amd64.AppImage" "$BUNDLE/deb/Hubble_${VERSION}_amd64.deb" dist/ ;;
          esac
          # The website takes only these exact names (src/lib/desktop/artifacts.ts classifyAsset).
          ls -la dist
          cd dist
          for file in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi
          done > "SHA256SUMS-${{ runner.os }}.txt"
          cat "SHA256SUMS-${{ runner.os }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hubble-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: Draft the release
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          NOTES="docs/release-notes/${VERSION}.md"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; echo; fi
            echo "## Downloads"
            echo
            echo "Get Hubble at https://hubble-hq.vercel.app/download — it offers the right installer for your computer."
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            while read -r sum file; do echo "| \`$file\` | \`$sum\` |"; done < dist/SHA256SUMS.txt
            echo
            echo "These builds are not code-signed yet: Windows SmartScreen and macOS Gatekeeper may ask you to confirm the first time Hubble opens."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "Hubble $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*

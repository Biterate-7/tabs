<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hubble</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup__header">
        <img class="popup__brand-mark" src="../icons/icon48.png" alt="" aria-hidden="true" />
        <span class="popup__title">Hubble</span>
      </header>

      <div class="popup__body">
        <div id="state-loading" class="popup__state">
          <p class="popup__muted">Detecting tabs…</p>
        </div>

        <div id="state-ready" class="popup__state" hidden>
          <!-- Hubble Desktop on this computer: straight in, you choose the project there. Shown once it has been seen. -->
          <section id="desktop-section" class="popup__desktop" aria-labelledby="desktop-heading" hidden>
            <h2 id="desktop-heading" class="popup__subheading">Hubble Desktop <span id="desktop-status" class="popup__muted"></span></h2>
            <div class="popup__row">
              <button id="desktop-current-button" class="popup__button">Add this tab</button>
              <button id="desktop-selected-button" class="popup__button popup__button--secondary" hidden>Add selected tabs</button>
              <button id="desktop-window-button" class="popup__button popup__button--secondary">Add all tabs</button>
            </div>
          </section>
          <!-- The project first: where this tab goes, the two ways to send it, and the quicker way next time. -->
          <section id="project-section" class="popup__project" aria-labelledby="project-heading" hidden>
            <h1 id="project-heading" class="popup__heading">Add to <span id="project-name"></span></h1>
            <div class="popup__row">
              <button id="add-current-button" class="popup__button" disabled>Add this tab</button>
              <button id="add-selected-button" class="popup__button popup__button--secondary" disabled hidden>Add selected tabs</button>
            </div>
            <p id="quick-add-hint" class="popup__muted popup__detail" hidden></p>
            <label class="popup__switch">
              <span class="popup__switch-label">Project</span>
              <select id="project-select" class="popup__select">
                <option value="">Choose a project…</option>
              </select>
            </label>
          </section>
          <p id="project-unavailable" class="popup__muted popup__detail" hidden>Open a project in Hubble to add this tab to it.</p>

          <!-- The plain dump: every tab in this window, into Hubble as it always was. -->
          <section class="popup__dump" aria-label="Dump this window">
            <p class="popup__count"><span id="tab-count">0</span> tabs in this window</p>
            <p id="import-status" class="popup__muted" hidden></p>
            <ul id="tab-preview" class="popup__preview"></ul>
            <button id="dump-button" class="popup__button popup__button--secondary">Dump tabs →</button>
          </section>
        </div>

        <div id="state-dumping" class="popup__state" hidden>
          <p class="popup__progress"><span class="popup__spinner" aria-hidden="true"></span><span id="dumping-message">Dumping tabs…</span></p>
          <p class="popup__muted popup__detail">You can close this popup — the dump keeps running.</p>
        </div>

        <div id="state-success" class="popup__state" hidden>
          <p class="popup__success" id="success-dump">Dumped <span id="success-count">0</span> tabs</p>
          <p class="popup__success" id="success-project" hidden></p>
          <p class="popup__muted popup__detail" id="success-detail" hidden></p>
          <button id="open-button" class="popup__button">Open Hubble</button>
        </div>

        <div id="state-error" class="popup__state" hidden>
          <p class="popup__error" id="error-message">Something went wrong.</p>
          <p class="popup__muted popup__detail" id="error-detail" hidden></p>
          <div class="popup__row">
            <button id="retry-button" class="popup__button popup__button--secondary">Try again</button>
            <button id="web-button" class="popup__button popup__button--secondary" hidden>Open Hubble Web</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
